apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: juice-shop
  labels:
    app: juice-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
    spec:
      serviceAccountName: pipeline-deployer
      securityContext: # Pod Hardening
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: juice-shop
        image: docker.io/bkimminich/juice-shop:v16.0.0
        ports:
        - containerPort: <PLACEHOLDER>
        securityContext: # Container Hardening
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: juice-shop-service
  namespace: juice-shop
spec:
  type: NodePort
  selector:
    app: juice-shop
  ports:
  - port: <PLACEHOLDER>
    targetPort: <PLACEHOLDER>
    nodePort: <PLACEHOLDER>