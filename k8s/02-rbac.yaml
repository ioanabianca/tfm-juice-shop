apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-deployer
  namespace: juice-shop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-minimal-role
  namespace: juice-shop
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-minimal-binding
  namespace: juice-shop
subjects:
- kind: ServiceAccount
  name: pipeline-deployer
  namespace: juice-shop
roleRef:
  kind: Role
  name: app-minimal-role
  apiGroup: rbac.authorization.k8s.io