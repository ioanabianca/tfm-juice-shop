name: DevSecOps Pipeline (SAST, SCA, IaC, Build, Trivy & Push)

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Analisis SAST
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: SonarCloud Static Analysis
        uses: SonarSource/sonarcloud-github-action@v3.0.0 # Nota: Mantener o migrar a sonarqube-scan-action en el futuro ya que v3 de este wrapper suele requerir la tag v3.0.0 o el commit específico (e.g., e2a1ee7e3cf...) dependiendo de su repositorio exacto de origen.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  # Evaluacion SCA y configuración IaC
  trivy-pre-build:
    name: Trivy SCA & IaC Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy Software Composition Analysis (SCA)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0' # Cambiar para forzar el bloqueo o permitir en caso de KO
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Infrastructure as Code Scan (IaC)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'config'
          scan-ref: './k8s'
          format: 'table'
          exit-code: '0' #Cambiar para forzar el bloqueo o permitir en caso de KO
          severity: 'CRITICAL,HIGH'

  # Realiza exactamente los mismos pasos que la opción DevOps
  devops-core-build:
    name: DevOps Traditional Core (Build & Push)
    needs: [sonarcloud, trivy-pre-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c5c5ed6a3ad25b8c45369f9634e367d75c781965 # v3.10.0

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=devsecops-latest
            type=sha,format=long

      - name: Log in to the Container registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v5.8.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Lee y analza la imágen guardada con Trivy
  post-build-security-scan:
    name: Post-Build Image Scan
    needs: devops-core-build
    runs-on: ubuntu-latest
    steps:
      - name: Run Trivy Container Image Scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}:devsecops-latest
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # Realiza el deploy una vez todo el analisis este realizado
  hardened-deploy:
    name: Hardened Deployment
    needs: post-build-security-scan
    runs-on: self-hosted # Para Self-Hosted Runner
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Execute Hardened Deployment in Local Kind
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          kubectl apply -f k8s/02-rbac.yaml
          kubectl apply -f k8s/03-network-policy.yaml
          kubectl apply -f k8s/01-deployment.yaml